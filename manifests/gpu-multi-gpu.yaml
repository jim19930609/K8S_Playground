apiVersion: v1
kind: Pod
metadata:
  name: gpu-multi-gpu
spec:
  restartPolicy: Never
  containers:
    - name: nvidia-smi
      image: nvidia/cuda:12.2.0-base-ubuntu22.04
      command: ["bash", "-lc", "nvidia-smi -L && nvidia-smi topo -m || true"]
      resources:
        limits:
          nvidia.com/gpu: 2
